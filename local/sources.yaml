# Local news for now.nesohq.com/local/ (update 14.5, a principal, 22 November 2026).
#
# Only official government sources: each city's and county's own website, the state's emergency management agency,
# and National Weather Service alerts for the state. NESO Live reads each site's homepage once a week, finds the
# news feed the site itself offers (a feed link on the page, or the usual CivicPlus or WordPress feed address), and
# keeps it only if it is on the site's own domain. `python -m neso_live check-feeds` shows what each place offers.
#
# To add a place: its name, "city" or "county", and its official homepage. To pin a feed you've checked, add
# feed: <address>. 14.5.3: feeds: [<address>, ...] lists feeds found by hand and opened first; the first that reads is kept.
# 14.5.4: the live copy of this list is local/sources.yaml in the NESO Now site repository (Nesoai/neso-now); this file is
# only the fallback. Pilot states first; local TV stations and GDELT wait on HQ's to-do list.
#
# Connecticut has no county governments (abolished in 1960), so its list is towns and cities only.

